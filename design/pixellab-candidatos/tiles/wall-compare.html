<!doctype html>
<meta charset="utf8">
<title>Muralha — procedural vs material PixelLab</title>
<style>
  body { background:#1a1d24; color:#cdd3dc; font:14px system-ui; margin:24px; }
  .row { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
  figure { margin:0; background:#22262e; padding:12px; border-radius:8px; }

<div class="row">

    <img src="wall-stone-v2.png?v=2">
  </figure>
</div>
