<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Avatar base — preview animado</title>
<style>
  body { margin: 0; background: #2a2e3a; color: #cdd3df; font-family: system-ui, sans-serif; }
  .wrap { padding: 24px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 12px; opacity: .6; margin: 0 0 20px; }
  .row { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
  .cell { text-align: center; }
  .cell canvas, .cell img {
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #353a48; border: 1px solid #00000040;
  }
  .label { font-size: 11px; opacity: .7; margin-top: 6px; }
  h2 { font-size: 13px; opacity: .8; margin: 28px 0 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Homem jovem — avatar base classless (128px, walk + 8 rotações)</h1>
  <p class="sub">Walk anima a ~6 fps. Oeste = flip de leste. Fundo cinza-frio simula o ambiente do jogo.</p>

  <h2>WALK (animado)</h2>
  <div class="row" id="walkRow"></div>

  <h2>8 ROTAÇÕES (estático)</h2>
  <div class="row" id="rotRow"></div>
</div>

<script>
const DIR = "design/pixellab-candidatos/chars/base-avatar/rotations-homem-jovem";
const SCALE = 1.4;
// walk: 3 direções geradas + oeste por flip
const WALK = [
  { key: "south", label: "Sul (frente)", flip: false },
  { key: "east",  label: "Leste",        flip: false },
  { key: "west",  label: "Oeste (flip)", from: "east", flip: true },
  { key: "north", label: "Norte (costas)", flip: false },
];
const ROTS = ["south","south-east","east","north-east","north","north-west","west","south-west"];

function cell(label) {
  const c = document.createElement("div"); c.className = "cell";
  const cv = document.createElement("canvas"); cv.width = 0; cv.height = 0;
  const lb = document.createElement("div"); lb.className = "label"; lb.textContent = label;
  c.appendChild(cv); c.appendChild(lb);
  return { c, cv, lb };
}
function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }

(async () => {
  // WALK
  const walkRow = document.getElementById("walkRow");
  for (const w of WALK) {
    const src = w.from ?? w.key;
    const frames = await Promise.all([0,1,2,3].map(i => loadImg(`${DIR}/walk-${src}-0${i}.png`)));
    const { c, cv } = cell(w.label);
    cv.width = frames[0].width * SCALE; cv.height = frames[0].height * SCALE;
    const ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false;
    walkRow.appendChild(c);
    let f = 0;
    setInterval(() => {
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.save();
      if (w.flip) { ctx.translate(cv.width, 0); ctx.scale(-1, 1); }
      ctx.drawImage(frames[f], 0, 0, cv.width, cv.height);
      ctx.restore();
      f = (f + 1) % 4;
    }, 160);
  }
  // ROTAÇÕES
  const rotRow = document.getElementById("rotRow");
  for (const d of ROTS) {
    try {
      const im = await loadImg(`${DIR}/rot-${d}.png`);
      const { c, cv } = cell(d);
      cv.width = im.width * SCALE; cv.height = im.height * SCALE;
      const ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false;
      ctx.drawImage(im, 0, 0, cv.width, cv.height);
      rotRow.appendChild(c);
    } catch {}
  }
})();
</script>
</body>
</html>
